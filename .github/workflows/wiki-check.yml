# Reusable: checks the PR body rules (Wiki:, Depends on:) with
# tools/wiki/check_pr.py from blade-of-grass (development; the PR itself in
# blade-of-grass). Callers name the job
# `wiki-check`, so the required status context is `wiki-check / check`.
# Spec: https://github.com/rmx-lt/blade-of-grass/issues/30
name: wiki-check

on:
  workflow_call:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          repository: rmx-lt/blade-of-grass
          # In blade-of-grass itself, run the checker from the PR, so a change
          # to it is tested by its own PR; everywhere else, from development.
          ref: ${{ github.repository == 'rmx-lt/blade-of-grass' && github.sha || 'development' }}
          path: .bog
          persist-credentials: false

      - name: Check the PR body
        run: python .bog/tools/wiki/check_pr.py --repo "$REPO" --pr "$PR"
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
