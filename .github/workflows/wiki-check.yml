# Reusable: checks the PR body rules (Wiki:, Depends on:) with
# tools/wiki/check_pr.py from blade-of-grass@development. Callers name the job
# `wiki-check`, so the required status context is `wiki-check / check`.
# Spec: https://github.com/rmx-lt/blade-of-grass/issues/30
name: wiki-check

on:
  workflow_call:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          repository: rmx-lt/blade-of-grass
          ref: development
          path: .bog

      - name: Check the PR body
        run: python .bog/tools/wiki/check_pr.py --repo "$REPO" --pr "$PR"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
