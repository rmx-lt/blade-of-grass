# Adds new issues to the org project Blade of Grass. Runs when an issue is
# opened, reopened or transferred. Why: the project's auto-add covers only one
# repo on our plan. Calls the reusable workflow next to it; the other repos call
# the same file from rmx-lt/blade-of-grass (tools/drift/callers/split/).
# Spec: https://github.com/rmx-lt/blade-of-grass/issues/74
name: add-to-project

on:
  issues:
    types: [opened, reopened, transferred]

permissions: {}

jobs:
  add-to-project:
    uses: ./.github/workflows/reusable-add-to-project.yml
    secrets: inherit
